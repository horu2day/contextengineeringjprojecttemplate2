<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js Gaussian Splatting Viewer</title>
    <link rel="stylesheet" href="styles/main.css">

    <!-- Babylon.js CDN - Global BABYLON object -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <!-- CRITICAL: Gaussian Splatting File Loader Plugin (MUST be loaded after babylon.js) -->
    <script src="https://cdn.babylonjs.com/loaders/babylon.splatFileLoader.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100vh;
            display: block;
            outline: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 10;
            text-align: center;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
            max-width: 300px;
        }
        #coordinates {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            font-family: monospace;
            z-index: 10;
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Gaussian Splatting Viewer...</div>

    <!-- File Upload Button -->
    <div id="uploadButton" style="position: absolute; top: 10px; right: 10px; z-index: 20;">
        <input type="file" id="fileInput" accept=".splat,.ply" style="display: none;">
        <button onclick="document.getElementById('fileInput').click()"
                style="background: rgba(0, 120, 255, 0.9); color: white; border: none;
                       padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px;
                       box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
            📁 Load Model (.splat/.ply)
        </button>
    </div>

    <!-- Performance Controls -->
    <div id="performanceControls" style="position: absolute; top: 60px; right: 10px; z-index: 20;
                                         background: rgba(0, 0, 0, 0.8); padding: 15px;
                                         border-radius: 8px; color: white; font-size: 13px;
                                         min-width: 250px; display: none;">
        <div style="margin-bottom: 12px;">
            <strong>⚙️ Performance Settings</strong>
        </div>

        <div style="margin-bottom: 10px;">
            <label for="maxSplatCount">Max Splats: <span id="maxSplatCountValue">100000</span></label>
            <input type="range" id="maxSplatCount" min="10000" max="1000000" step="10000" value="100000"
                   style="width: 100%; margin-top: 5px;">
        </div>

        <div style="margin-bottom: 10px;">
            <label for="qualityMode">Quality:</label>
            <select id="qualityMode" style="width: 100%; padding: 5px; margin-top: 5px; border-radius: 3px;">
                <option value="0" selected>Low (Fastest)</option>
                <option value="1">Medium</option>
                <option value="2">High (Slowest)</option>
            </select>
        </div>

        <button id="applySettings" style="width: 100%; padding: 8px; background: rgba(0, 200, 100, 0.9);
                                           color: white; border: none; border-radius: 5px; cursor: pointer;
                                           font-size: 13px; margin-top: 5px;">
            ✓ Apply Settings
        </button>
    </div>

    <!-- Drag & Drop Overlay -->
    <div id="dropZone" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                               background: rgba(0, 120, 255, 0.1); border: 3px dashed rgba(0, 120, 255, 0.5);
                               display: none; z-index: 15; pointer-events: none;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                    font-size: 24px; color: white; background: rgba(0, 0, 0, 0.8);
                    padding: 30px 50px; border-radius: 10px;">
            📥 Drop .splat or .ply file here
        </div>
    </div>

    <div id="info">
        <strong>Controls:</strong><br>
        Left Mouse: Rotate<br>
        Scroll: Zoom<br>
        Right Mouse: Pan<br>
        Click: Show Coordinates<br>
        <span style="color: #4af;">Drag & Drop: Load Model</span><br>
        <div id="fps" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.2);">
            <strong>FPS:</strong> <span id="fpsValue">--</span>
        </div>
    </div>
    <div id="coordinates"></div>
    <canvas id="renderCanvas"></canvas>
    <script src="src/main-global.js"></script>
</body>
</html>
