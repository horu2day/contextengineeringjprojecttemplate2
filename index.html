<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js Gaussian Splatting Viewer</title>
    <link rel="stylesheet" href="styles/main.css">

    <!-- Babylon.js CDN - Global BABYLON object -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100vh;
            display: block;
            outline: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 10;
            text-align: center;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
            max-width: 300px;
        }
        #coordinates {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            font-family: monospace;
            z-index: 10;
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Gaussian Splatting Viewer...</div>
    <div id="info">
        <strong>Controls:</strong><br>
        Left Mouse: Rotate<br>
        Scroll: Zoom<br>
        Right Mouse: Pan<br>
        Click: Show Coordinates
    </div>
    <div id="coordinates"></div>
    <canvas id="renderCanvas"></canvas>
    <script src="src/main-global.js"></script>
</body>
</html>
